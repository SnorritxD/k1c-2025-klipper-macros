# ==============================================================================
#                     KLIPPER MACRO CONFIGURATION INDEX
# ==============================================================================
# 1. PRINT CONTROLS ......... (PRINT_START, PRINT_END, CANCEL, PAUSE, RESUME)
# 2. FILAMENT MANAGEMENT .... (LOAD / UNLOAD PLA, PETG, ABS & M600)
# 3. PRINT PREPARATION ...... (CLEAN_NOZZLE, SMART_PURGE, CREATE_BED_MESH)
# 4. CALIBRATION & SENSORS .. (PID TUNING, INPUT SHAPER, ACCELEROMETER)
# 5. HARDWARE & ENVIRONMENT . (LED LIGHTING, CHASSIS FAN / M141)
# 6. MAINTENANCE ............ (MAINTENANCE_PARK, CHANGE_NOZZLE)
# 7. SLICER COMPATIBILITY ... (T0, M117 OVERRIDE)
# 8. SYSTEM & AUTOMATION .... (GITHUB BACKUP & STARTUP SCRIPT)
# ==============================================================================


# ==============================================================================
# 1. PRINT CONTROLS (START / END / CANCEL / PAUSE / RESUME)
# ==============================================================================

[gcode_macro PRINT_START]
description: Full start macro with countdown Heat Soak, Clean, Native Adaptive Mesh, and Smart Purge
gcode:
    # 1. Extract parameters passed from the slicer
    {% set BED_TEMP = params.BED_TEMP|default(params.BED|default(50))|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(params.EXTRUDER|default(200))|float %}
    {% set CHAMBER_TEMP = params.CHAMBER|default(0)|float %}
    {% set MATERIAL = params.MATERIAL|default('')|upper %}
    {% set SOAK_TIME = params.SOAK|default(-1)|int %}

    # Automatic Heat Soak duration determination (10 min for ABS/ASA/Bed >= 90°C, otherwise 0 min)
    {% if SOAK_TIME == -1 %}
        {% if MATERIAL in ['ABS', 'ASA', 'PC', 'PA', 'PA-CF'] or BED_TEMP >= 90 %}
            {% set SOAK_TIME = 10 %}
        {% else %}
            {% set SOAK_TIME = 0 %}
        {% endif %}
    {% endif %}

    # 2. Control chassis fan based on M141 chamber target or bed temperature
    {% set CHAMBER_TARGET = params.CHAMBER|default(35)|float %}
    {% if BED_TEMP >= 90 or MATERIAL in ['ABS', 'ASA', 'PC', 'PA', 'PA-CF'] %}
        SET_FAN_SPEED FAN=chassis_fan SPEED=0.0                            ; Turn off fan for high-temp materials (ABS/ASA) to prevent warping
    {% else %}
        SET_FAN_SPEED FAN=chassis_fan SPEED=0.8                            ; Turn on fan (80%) for low-temp materials (PLA/PETG)
    {% endif %}

    # 3. Heat nozzle to standby (140°C) before homing to soften hard filament blobs
    M117 Heating bed ({BED_TEMP}°C), Nozzle to standby (140°C)...
    M140 S{BED_TEMP}                                                        ; M140: Set bed temperature (non-blocking)
    M104 S140                                                               ; M104: Set extruder temperature to standby (non-blocking)
    M109 S140                                                               ; M109: Wait for extruder temperature to reach 140°C before homing
    M190 S{BED_TEMP}                                                        ; M190: Wait for bed temperature to reach target

    # 4. Safe homing sequence with warm nozzle
    {% if "xyz" not in printer.toolhead.homed_axes %}
        M117 Homing with warm nozzle...
        G28                                                                 ; G28: Home all axes (X, Y, Z)
    {% endif %}

    # 5. Countdown Heat Soak (active for ABS/ASA or Bed >= 90°C)
    {% if SOAK_TIME > 0 %}
        M117 Heating enclosure ({SOAK_TIME} min heat soak)...
        {% for minute in range(SOAK_TIME, 0, -1) %}
            M117 {minute} minutes remaining for enclosure heat soak...
            G4 P60000                                                       ; G4 P60000: Dwell/wait for 60,000 milliseconds (1 minute)
        {% endfor %}
    {% endif %}

    # 6. Thoroughly clean nozzle at the rear
    M117 Cleaning nozzle at the rear...
    CLEAN_NOZZLE

    # 7. Native Klipper adaptive bed mesh calibration on a clean nozzle
    M117 Measuring adaptive bed mesh...
    BED_MESH_CALIBRATE ADAPTIVE=1

    # 8. Park front-left while heating to full printing temperature
    G90                                                                     ; G90: Set positioning to absolute mode
    G1 Z5 F3000                                                             ; G1: Lift Z axis to 5mm at feedrate 3000 mm/min
    G1 X2 Y10 F9000                                                         ; G1: Move toolhead to front-left (X2, Y10) at speed 9000 mm/min

    # 9. Heat extruder to final printing temperature
    M117 Heating up to {EXTRUDER_TEMP}°C...
    M109 S{EXTRUDER_TEMP}                                                   ; M109: Wait for extruder to reach target printing temperature

    # 10. Execute smart adaptive purge line
    M117 Drawing smart purge line...
    SMART_PURGE

    # 11. Start printing
    M117 Printing started!

# Alias for backwards compatibility with existing G-code files
[gcode_macro START_PRINT]
rename_existing: BASE_START_PRINT
gcode:
    PRINT_START {rawparams}

[gcode_macro PRINT_END]
description: Completes the print, turns off heaters and fans, and parks the toolhead
gcode:
    # 1. Calculate safe Z-hop height to prevent toolhead from hitting bed frame limits
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% if act_z < (max_z - 10.0) %}
        {% set z_safe = 10.0 %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}

    # 2. Retract filament & lift toolhead
    G91                                                                     ; G91: Set positioning to relative mode
    G1 E-2 F2700                                                            ; G1: Retract 2mm of filament at feedrate 2700 mm/min
    G1 Z{z_safe} F3000                                                      ; G1: Raise Z axis by calculated safe height
    G90                                                                     ; G90: Restore positioning to absolute mode

    # 3. Park toolhead at the rear
    G1 X210 Y210 F9000                                                      ; G1: Move toolhead to rear corner (X210, Y210) at speed 9000 mm/min

    # 4. Turn off heaters
    M104 S0                                                                 ; M104: Turn off hotend heater
    M140 S0                                                                 ; M140: Turn off print bed heater

    # 5. Turn off all cooling fans
    M106 S0                                                                 ; M106: Turn off part cooling fan
    SET_FAN_SPEED FAN=side_fan SPEED=0.0                                    ; Turn off auxiliary side cooling fan
    
    # Disable chassis exhaust fan via M141 macro
    M141 S0
    
    # Extra check if chassis_fan is defined as fan_generic
    {% if 'fan_generic chassis_fan' in printer %}
        SET_FAN_SPEED FAN=chassis_fan SPEED=0.0
    {% endif %}

    # 6. Disable stepper motors for X, Y, and Extruder (keep Z powered to support bed)
    M84 X Y E                                                               ; M84: Disable stepper motors for X, Y, and E axes

    # 7. Clear bed mesh from memory and notify user
    BED_MESH_CLEAR
    M117 Print completed successfully!

# Alias for backwards compatibility
[gcode_macro END_PRINT]
rename_existing: BASE_END_PRINT
gcode:
    PRINT_END {rawparams}

[gcode_macro CANCEL_PRINT]
description: Cancel the print, turn everything off, and park safely
rename_existing: BASE_CANCEL_PRINT
gcode:
    # 1. SAFETY FIRST: Immediately turn off heaters
    M104 S0                                                                 ; M104: Turn off hotend heater
    M140 S0                                                                 ; M140: Turn off print bed heater
    CLEAR_PAUSE

    # 2. SAFE MOVEMENT: Lift Z axis if toolhead is homed
    {% if "xyz" in printer.toolhead.homed_axes %}
        {% set max_z = printer.toolhead.axis_maximum.z|float %}
        {% set act_z = printer.toolhead.position.z|float %}
        {% if act_z < (max_z - 10.0) %}
            {% set z_safe = 10.0 %}
        {% else %}
            {% set z_safe = max_z - act_z %}
        {% endif %}
        
        G91                                                                 ; G91: Set positioning to relative mode
        G1 E-2 F2700                                                        ; G1: Retract 2mm of filament at speed 2700 mm/min
        G1 Z{z_safe} F3000                                                  ; G1: Raise Z axis by safe offset height
        G90                                                                 ; G90: Restore positioning to absolute mode
        
        # Park toolhead safely at the rear
        G1 X210 Y210 F9000                                                  ; G1: Move toolhead to rear parking location (X210, Y210)
    {% endif %}

    # 3. TURN OFF FANS: Stop fans after toolhead reaches parking position
    M106 S0                                                                 ; M106: Turn off part cooling fan
    SET_FAN_SPEED FAN=side_fan SPEED=0.0                                    ; Turn off side auxiliary fan
    M141 S0
    {% if 'fan_generic chassis_fan' in printer %}
        SET_FAN_SPEED FAN=chassis_fan SPEED=0.0
    {% endif %}

    # 4. MOTORS & MESH: Disable X/Y/E motors and clear active mesh
    M84 X Y E                                                               ; M84: Disable stepper motors for X, Y, and E axes
    BED_MESH_CLEAR
    M117 Print cancelled

    # 5. Call default Klipper cancel routine
    BASE_CANCEL_PRINT

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    # 1. Save state and pause print execution
    {% set z = params.Z|default(10)|int %}
    SAVE_GCODE_STATE NAME=PAUSE_state                                       ; Save current toolhead state and position coordinates
    BASE_PAUSE                                                              ; Execute native Klipper pause command

    # 2. Retract filament and lift toolhead
    G91                                                                     ; G91: Set positioning to relative mode
    G1 E-2 F2700                                                            ; G1: Retract 2mm of filament at speed 2700 mm/min
    G1 Z{z} F3000                                                           ; G1: Raise Z axis by relative offset height
    
    # 3. Move toolhead to safe parking position
    G90                                                                     ; G90: Restore positioning to absolute mode
    G1 X10 Y220 F9000                                                       ; G1: Move toolhead to safe pause location (X10, Y220)

[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    # 1. Prime/unretract filament
    G91                                                                     ; G91: Set positioning to relative mode
    G1 E2 F2700                                                             ; G1: Extrude 2mm of filament at speed 2700 mm/min
    
    # 2. Restore pre-pause location and resume print
    G90                                                                     ; G90: Restore positioning to absolute mode
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1                             ; Restore previous toolhead position with movement
    BASE_RESUME                                                             ; Resume printing execution in Klipper


# ==============================================================================
# 2. FILAMENT MANAGEMENT (LOAD / UNLOAD / M600)
# ==============================================================================

# ------------------------------------------------------------------------------
# FILAMENT LOADING
# ------------------------------------------------------------------------------

[gcode_macro LOAD_PLA]
description: Fast and safe PLA filament loading for DXC + Unicorn Nozzle (optimized)
gcode:
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(220)|int %}
    
    # 1. Heat hotend to target PLA temperature
    M117 Heating PLA and loading...
    M109 S{EXTRUDER_TEMP}                                                   ; M109: Wait for hotend to reach target PLA temperature (220°C)
    
    G91                                                                     ; G91: Set positioning to relative mode
    
    # 2. Fast loading up to heatbreak/meltzone
    G1 E60 F800                                                             ; G1: Extrude 60mm of filament rapidly at speed 800 mm/min
    
    # 3. Transition into nozzle melt zone
    G1 E20 F300                                                             ; G1: Extrude 20mm at moderate speed 300 mm/min
    
    # 4. Purge line to clear previous filament color/residue
    G1 E15 F120                                                             ; G1: Extrude 15mm slowly at speed 120 mm/min
    
    # 5. Anti-ooze retract and finish
    G1 E-2 F1800                                                            ; G1: Retract 2mm quickly at speed 1800 mm/min to prevent oozing
    G90                                                                     ; G90: Restore positioning to absolute mode
    M400                                                                    ; M400: Wait for all movements to complete
    M104 S0                                                                 ; M104: Turn off hotend heater
    
    M117 PLA loaded successfully!

[gcode_macro LOAD_PETG]
description: Fast and safe PETG filament loading for DXC + Unicorn Nozzle (optimized)
gcode:
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(240)|int %}
    
    # 1. Heat hotend to target PETG temperature
    M117 Heating PETG and loading...
    M109 S{EXTRUDER_TEMP}                                                   ; M109: Wait for hotend to reach target PETG temperature (240°C)
    
    G91                                                                     ; G91: Set positioning to relative mode
    
    # 2. Fast loading up to meltzone
    G1 E60 F800                                                             ; G1: Extrude 60mm of filament rapidly at speed 800 mm/min
    
    # 3. Transition into nozzle
    G1 E20 F300                                                             ; G1: Extrude 20mm at moderate speed 300 mm/min
    
    # 4. Purge line for viscous PETG material
    G1 E20 F120                                                             ; G1: Extrude 20mm slowly at speed 120 mm/min
    
    # 5. Anti-ooze retract and finish
    G1 E-2 F1800                                                            ; G1: Retract 2mm quickly at speed 1800 mm/min
    G90                                                                     ; G90: Restore positioning to absolute mode
    M400                                                                    ; M400: Wait for all planned moves to finish
    M104 S0                                                                 ; M104: Turn off hotend heater
    
    M117 PETG loaded successfully!

[gcode_macro LOAD_ABS]
description: Fast and safe ABS filament loading for DXC + Unicorn Nozzle (optimized)
gcode:
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(255)|int %}
    
    # 1. Heat hotend to target ABS temperature
    M117 Heating ABS and loading...
    M109 S{EXTRUDER_TEMP}                                                   ; M109: Wait for hotend to reach target ABS temperature (255°C)
    
    G91                                                                     ; G91: Set positioning to relative mode
    
    # 2. Fast loading up to meltzone
    G1 E60 F800                                                             ; G1: Extrude 60mm of filament rapidly at speed 800 mm/min
    
    # 3. Transition into nozzle
    G1 E20 F300                                                             ; G1: Extrude 20mm at speed 300 mm/min
    
    # 4. Extra purge for stiff/viscous ABS material
    G1 E25 F120                                                             ; G1: Extrude 25mm slowly at speed 120 mm/min
    
    # 5. Anti-ooze retract and finish
    G1 E-2 F1800                                                            ; G1: Retract 2mm quickly at speed 1800 mm/min
    G90                                                                     ; G90: Restore positioning to absolute mode
    M400                                                                    ; M400: Wait for move execution to complete
    M104 S0                                                                 ; M104: Turn off hotend heater

    M117 ABS loaded successfully!

# ------------------------------------------------------------------------------
# FILAMENT UNLOADING & CHANGING
# ------------------------------------------------------------------------------

[gcode_macro _DXC_RUNOUT_UNLOAD]
description: Pull the last bit of filament out of the DXC before the printer parks
gcode:
    M118 Filament Runout! Pulling remnant out of DXC...                     ; M118: Send message to console log
    
    G91                                                                     ; G91: Set positioning to relative mode
    
    # 1. Short ramming/squish move to shape tip
    G1 E2 F300                                                              ; G1: Push 2mm filament forward at speed 300 mm/min
    G1 E-10 F1500                                                           ; G1: Fast 10mm retract to form a sharp filament tip
    
    # 2. Slow retract through melt zone (25mm)
    G1 E-25 F350                                                            ; G1: Retract 25mm slowly at speed 350 mm/min through thermal break
    G4 P1500                                                                ; G4: Pause/dwell for 1.5 seconds to allow tip cooling
    
    # 3. Fast retract past drive gears (105mm)
    G1 E-105 F2000                                                          ; G1: Retract remaining 105mm rapidly past extruder gears
    
    G90                                                                     ; G90: Restore positioning to absolute mode
    M400                                                                    ; M400: Wait for all movements to complete
    
    # 4. Pause print execution and park toolhead
    PAUSE                                                                   ; PAUSE: Pause print execution and park toolhead

[gcode_macro UNLOAD_PLA]
description: PLA Unload past drive gears for DXC extruder
gcode:
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(220)|int %}
    
    # 1. Heat hotend to PLA unloading temperature
    M117 Heating PLA ({EXTRUDER_TEMP}°C)...                                 ; M117: Display status message
    M109 S{EXTRUDER_TEMP}                                                   ; M109: Wait for hotend target temperature
    
    G91                                                                     ; G91: Set positioning to relative mode
    
    # 2. Purge & short ramming to shape clean tip
    G1 E5 F120                                                              ; G1: Extrude 5mm slowly to flush nozzle
    G1 E2 F300                                                              ; G1: Push 2mm forward at speed 300 mm/min
    G1 E-10 F1500                                                           ; G1: Fast 10mm retract to shape filament tip
    
    # 3. Slow retract through melt zone (25mm)
    G1 E-25 F350                                                            ; G1: Retract 25mm slowly at speed 350 mm/min
    G4 P1500                                                                ; G4: Pause 1.5 seconds to cool tip
    
    # 4. Fast retract past drive gears (105mm)
    G1 E-105 F2000                                                          ; G1: Retract 105mm rapidly past gears
    
    G90                                                                     ; G90: Restore positioning to absolute mode
    M400                                                                    ; M400: Wait for movements to complete
    M104 S0                                                                 ; M104: Turn off hotend heater
    
    M117 PLA released! You can unload it now.

[gcode_macro UNLOAD_PETG]
description: PETG Unload past drive gears for DXC extruder
gcode:
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(240)|int %}
    
    # 1. Heat hotend to PETG unloading temperature
    M117 Heating PETG ({EXTRUDER_TEMP}°C)...                                ; M117: Display status message
    M109 S{EXTRUDER_TEMP}                                                   ; M109: Wait for hotend target temperature
    
    G91                                                                     ; G91: Set positioning to relative mode
    
    # 2. Purge & push move for tip shaping
    G1 E5 F120                                                              ; G1: Extrude 5mm slowly to flush nozzle
    G1 E2 F300                                                              ; G1: Push 2mm forward at speed 300 mm/min
    G1 E-12 F1200                                                           ; G1: Fast 12mm retract to shape tip
    
    # 3. Slow retract through melt zone (28mm)
    G1 E-28 F300                                                            ; G1: Retract 28mm slowly at speed 300 mm/min
    G4 P2000                                                                ; G4: Pause 2.0 seconds (extended for viscous PETG tip solidifying)
    
    # 4. Fast retract past drive gears (100mm)
    G1 E-100 F2000                                                          ; G1: Retract 100mm rapidly past gears
    
    G90                                                                     ; G90: Restore positioning to absolute mode
    M400                                                                    ; M400: Wait for movements to complete
    M104 S0                                                                 ; M104: Turn off hotend heater
    
    M117 PETG released! You can unload it now.

[gcode_macro UNLOAD_ABS]
description: ABS Unload past drive gears for DXC extruder (Optimized)
gcode:
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(255)|int %}
    
    # 1. Heat hotend to ABS unloading temperature
    M117 Heating ABS ({EXTRUDER_TEMP}°C)...                                 ; M117: Display status message
    M109 S{EXTRUDER_TEMP}                                                   ; M109: Wait for hotend target temperature
    
    G91                                                                     ; G91: Set positioning to relative mode
    
    # 2. Purge & ramming to prevent stringing/thick tip
    G1 E5 F120                                                              ; G1: Extrude 5mm slowly to flush nozzle
    G1 E2 F400                                                              ; G1: Push 2mm forward at speed 400 mm/min
    G1 E-15 F1800                                                           ; G1: Fast 15mm retract to snap filament string
    
    # 3. Slow retract through melt zone (25mm)
    G1 E-25 F300                                                            ; G1: Retract 25mm slowly at speed 300 mm/min
    G4 P1500                                                                ; G4: Pause 1.5 seconds to cool tip
    
    # 4. Fast retract past drive gears (100mm)
    G1 E-100 F2200                                                          ; G1: Retract 100mm rapidly past gears
    
    G90                                                                     ; G90: Restore positioning to absolute mode
    M400                                                                    ; M400: Wait for movements to complete
    M104 S0                                                                 ; M104: Turn off hotend heater
    
    M117 ABS released! You can unload it now.

[gcode_macro M600]
description: Manual filament or color change mid-print (optimized for DXC + Unicorn)
gcode:
    {% set X = params.X|default(10)|float %}
    {% set Y = params.Y|default(20)|float %}
    {% set Z = params.Z|default(10)|float %}

    # 1. Pause printing and park head
    PAUSE X={X} Y={Y} Z={Z}                                                 ; PAUSE: Pause print execution and park toolhead
    M117 Unloading filament for color change...
    
    G91                                                                     ; G91: Set positioning to relative mode
    
    # 2. Short push move for tip shaping
    G1 E2 F300                                                              ; G1: Push 2mm filament forward at speed 300 mm/min
    G1 E-10 F1500                                                           ; G1: Fast 10mm retract to shape tip
    
    # 3. Slow retract through melt zone (25mm)
    G1 E-25 F350                                                            ; G1: Retract 25mm slowly at speed 350 mm/min
    G4 P1500                                                                ; G4: Pause 1.5 seconds to cool tip
    
    # 4. Fast retract past drive gears (105mm)
    G1 E-105 F2000                                                          ; G1: Retract 105mm rapidly past extruder gears
    
    G90                                                                     ; G90: Restore positioning to absolute mode
    M400                                                                    ; M400: Wait for all planned moves to complete
    
    M117 Load new filament and press Resume!

# ==============================================================================
# 3. PRINT PREPARATION & GEOMETRY
# ==============================================================================

[gcode_macro CLEAN_NOZZLE]
description: Wipes at 180°C, cools down to 140°C, wipes oozed residue, and parks at X110 Y110 Z5
gcode:
    {% set HOME_TEMP = params.HOME_TEMP|default(140)|float %}
    {% set CLEAN_TEMP = params.CLEAN_TEMP|default(180)|float %}
    {% set MESH_TEMP = params.MESH_TEMP|default(140)|float %}
    
    # 1. Ensure toolhead is homed at safe temperature (140°C)
    {% if "xyz" not in printer.toolhead.homed_axes %}
        M104 S{HOME_TEMP}                                                   ; M104: Set extruder temperature to 140°C (non-blocking)
        M109 S{HOME_TEMP}                                                   ; M109: Wait for extruder temperature to reach 140°C
        G28                                                                 ; G28: Home all axes
    {% endif %}
    
    # 2. Move to rear brush position
    G90                                                                     ; G90: Set positioning to absolute mode
    G1 Z5 F3000                                                             ; G1: Raise Z axis to 5mm at speed 3000 mm/min
    G1 X95 Y223 F9000                                                       ; G1: Rapid move to cleaning brush start position (X95, Y223)
    
    # 3. First wiping cycle at 180°C (softens hardened debris/plastic)
    M109 S{CLEAN_TEMP}                                                      ; M109: Wait for hotend temperature to reach 180°C
    G1 Z1.8 F600                                                            ; G1: Lower nozzle into brush scrubbing height (Z1.8mm)
    
    {% for wipe in range(1, 5) %}
        G1 X130 F12000                                                      ; G1: Wipe rightward across brush (X130) at speed 12000 mm/min
        G1 X95 F12000                                                       ; G1: Wipe leftward across brush (X95) at speed 12000 mm/min
    {% endfor %}
    
    # 4. Cool nozzle down to 140°C & perform secondary wipe (removes oozed residue)
    G1 Z5 F3000                                                             ; G1: Lift nozzle clear of brush during cooling phase
    M109 S{MESH_TEMP}                                                       ; M109: Wait for hotend temperature to drop to 140°C
    
    G1 Z1.8 F600                                                            ; G1: Lower back down into brush scrubbing height
    {% for wipe in range(1, 3) %}
        G1 X130 F12000                                                      ; G1: Wipe rightward
        G1 X95 F12000                                                       ; G1: Wipe leftward
    {% endfor %}
    
    # 5. Park toolhead centered over bed at height Z5
    G1 Z5 F3000                                                             ; G1: Lift Z axis to height Z5
    G1 X110 Y110 F9000                                                      ; G1: Move toolhead to bed center (X110, Y110)

[gcode_macro SMART_PURGE]
description: Smart adaptive purge line right next to the model
gcode:
    # 1. Determine model bounds (fallback to coordinates X10 Y10 if object data is unreadable)
    {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
    {% set x_min = all_points | map(attribute=0) | min | default(10) %}
    {% set y_min = all_points | map(attribute=1) | min | default(10) %}
    
    # 2. Position adaptive purge line offset by 10mm Southwest of print bounds
    {% set purge_x = [x_min - 10, 5] | max %}
    {% set purge_y = [y_min - 10, 5] | max %}

    # 3. Move to purge line start location
    G90                                                                     ; G90: Set positioning to absolute mode
    G1 Z5 F3000                                                             ; G1: Lift Z axis to 5mm
    G1 X{purge_x} Y{purge_y} F9000                                          ; G1: Rapid move to computed purge start coordinates
    G1 Z0.28 F600                                                           ; G1: Lower nozzle to layer height (0.28mm)
    
    # 4. Execute purge extrusion movements
    G92 E0                                                                  ; G92: Reset extruder position accumulator to 0
    G1 X{purge_x + 30} Y{purge_y} E10 F1500                                 ; G1: Extrude 10mm filament over 30mm line segment
    G1 X{purge_x + 30} Y{purge_y + 0.4} F5000                               ; G1: Offset 0.4mm along Y axis
    G1 X{purge_x} Y{purge_y + 0.4} E20 F1500                                ; G1: Extrude 10mm additional filament on return purge line
    G92 E0                                                                  ; G92: Reset extruder position accumulator to 0
    G1 Z2 F3000                                                             ; G1: Lift nozzle clear of purge line

[gcode_macro CREATE_BED_MESH]
description: Creates bed mesh (use SKIP_CLEAN=1 if the nozzle is already clean)
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(50)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(140)|float %}
    {% set SKIP_CLEAN = params.SKIP_CLEAN|default(0)|int %}

    # 1. Heat components to allow thermal expansion stabilization
    M140 S{BED_TEMP}                                                        ; M140: Set bed target temperature
    M104 S{EXTRUDER_TEMP}                                                   ; M104: Set hotend target temperature
    
    M190 S{BED_TEMP}                                                        ; M190: Wait for bed to reach target temperature
    M109 S{EXTRUDER_TEMP}                                                   ; M109: Wait for hotend to reach target temperature

    # 2. Home axes if required
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                                                                 ; G28: Home X, Y, Z axes
    {% endif %}

    # 3. Clean nozzle unless explicitly skipped via parameter (SKIP_CLEAN=1)
    {% if SKIP_CLEAN == 0 %}
        CLEAN_NOZZLE
    {% endif %}

    # 4. Perform Klipper bed mesh calibration routine
    BED_MESH_CALIBRATE

    # 5. Park head over bed center at Z5
    G90                                                                     ; G90: Set positioning to absolute mode
    G1 Z5 F3000                                                             ; G1: Lift Z axis to 5mm
    G1 X110 Y110 F9000                                                      ; G1: Move toolhead to build surface center (X110, Y110)

    # 6. Disable heaters
    M104 S0                                                                 ; M104: Turn off hotend heater
    M140 S0                                                                 ; M140: Turn off print bed heater


# ==============================================================================
# 4. CALIBRATION & SENSORS
# ==============================================================================

# ------------------------------------------------------------------------------
# PID CALIBRATION
# ------------------------------------------------------------------------------

[gcode_macro PID_HOTEND]
description: Performs PID calibration for the hotend and saves
gcode:
    {% set TARGET = params.TARGET|default(230)|int %}
    M117 PID hotend calibration ({TARGET}°C)...
    
    # 1. Run hotend PID autotune and save
    PID_CALIBRATE HEATER=extruder TARGET={TARGET}                           ; Run native Klipper hotend PID autotune
    SAVE_CONFIG                                                             ; Save autotuned PID parameters to printer.cfg and restart Klipper
                                                                          
[gcode_macro PID_BED]
description: Performs PID calibration for the bed and saves
gcode:
    {% set TARGET = params.TARGET|default(60)|int %}
    M117 PID bed calibration ({TARGET}°C)...
    
    # 1. Run bed PID autotune and save
    PID_CALIBRATE HEATER=heater_bed TARGET={TARGET}                         ; Run native Klipper bed PID autotune
    SAVE_CONFIG                                                             ; Save autotuned PID parameters to printer.cfg and restart Klipper

# ------------------------------------------------------------------------------
# INPUT SHAPER & ACCELEROMETER
# ------------------------------------------------------------------------------

[gcode_macro CALIBRATE_INPUT_SHAPER]
description: Performs a complete Input Shaper calibration for X and Y and saves
gcode:
    # 1. Home all axes if not already homed
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                                                                 ; G28: Home all axes prior to testing
    {% endif %}
    
    # 2. Run dual axis frequency sweep and save
    M117 Starting Input Shaper calibration...
    SHAPER_CALIBRATE                                                        ; Execute resonance frequency sweep on X and Y axes using accelerometer
    M117 Saving results...
    SAVE_CONFIG                                                             ; Save optimal frequency limits and shaper algorithms to printer.cfg

[gcode_macro CALIBRATE_SHAPER_X]
description: Performs Input Shaper calibration for the X-axis only
gcode:
    # 1. Home all axes if needed
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                                                                 ; G28: Home all axes prior to testing
    {% endif %}
    
    # 2. Execute X axis frequency sweep and save
    M117 Starting Input Shaper X-axis...
    SHAPER_CALIBRATE AXIS=X                                                 ; Execute resonance frequency sweep specifically on X axis
    SAVE_CONFIG                                                             ; Save results to configuration file

[gcode_macro CALIBRATE_SHAPER_Y]
description: Performs Input Shaper calibration for the Y-axis only
gcode:
    # 1. Home all axes if needed
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                                                                 ; G28: Home all axes prior to testing
    {% endif %}
    
    # 2. Execute Y axis frequency sweep and save
    M117 Starting Input Shaper Y-axis...
    SHAPER_CALIBRATE AXIS=Y                                                 ; Execute resonance frequency sweep specifically on Y axis
    SAVE_CONFIG                                                             ; Save results to configuration file

[gcode_macro TEST_ACCEL]
description: Checks if the K1C accelerometers are responding
gcode:
    # 1. Query hardware accelerometer
    ACCELEROMETER_QUERY                                                     ; Query onboard ADXL/LIS3DH sensors to test communication status


# ==============================================================================
# 5. HARDWARE CONTROLS (FANS & LIGHTS)
# ==============================================================================

# Fluidd interface LED toggle logic & screen button compatibility
[gcode_macro TOGGLE_LED]
description: Toggles LED lighting on/off
gcode:
    # 1. Check current state and toggle white LED strip channel
    {% if printer["led lighting"].color_data[0][3] > 0 %}
        SET_LED LED=lighting WHITE=0.0                                      ; Turn LED strip brightness off (0.0)
    {% else %}
        SET_LED LED=lighting WHITE=1.0                                      ; Set LED strip to maximum white brightness (1.0)
    {% endif %}

# RESTORED: Temperature Fan target adjustment macro
[gcode_macro SET_CHASSIS_TARGET]
description: Set target temperature for the enclosure (e.g. SET_CHASSIS_TARGET TARGET=40)
gcode:
    # 1. Set PID target temperature for chamber fan
    {% set TARGET = params.TARGET|default(35)|float %}
    SET_TEMPERATURE_FAN_TARGET temperature_fan=chassis_fan target={TARGET}  ; Set temperature fan PID target temperature
    M117 Chassis target: {TARGET}°C

[gcode_macro M141]
description: Link OrcaSlicer chamber temperature (M141) to fan_generic
gcode:
    # 1. Adjust chassis fan speed depending on requested chamber temperature
    {% set S = params.S|default(0)|float %}
    {% if S > 0 and S <= 40 %}
        SET_FAN_SPEED FAN=chassis_fan SPEED=0.8                             ; PLA/PETG: Set fan speed to 80% for cool chamber targets (<=40°C)
    {% else %}
        SET_FAN_SPEED FAN=chassis_fan SPEED=0.0                             ; ABS/ASA: Turn fan OFF to keep chamber warm (>40°C)
    {% endif %}


# ==============================================================================
# 6. MAINTENANCE & NOZZLE REPLACEMENT
# ==============================================================================

[gcode_macro MAINTENANCE_PARK]
description: Parks toolhead cold at front for maintenance or build plate swap
gcode:
    # 1. Home all axes if not already homed
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                                                                 ; G28: Home all axes prior to positioning
    {% endif %}
    
    # 2. Position toolhead at front and drop bed for easy maintenance access
    G90                                                                     ; G90: Set positioning to absolute mode
    G1 Z80 F3000                                                            ; G1: Lower bed to Z80 at feedrate 3000 mm/min
    G1 X110 Y20 F9000                                                       ; G1: Move toolhead to front center (X110, Y20)
    M117 Maintenance mode active (cold)

[gcode_macro CHANGE_NOZZLE]
description: Heats up to 140C, homes safely, parks at front, and continues heating for nozzle swap
gcode:
    {% set TARGET = params.TEMP|default(220)|int %}
    
    # 1. Heat hotend safely to softening point before homing to protect PEI sheet
    M104 S140                                                               ; M104: Heat hotend to 140°C (non-blocking)
    M109 S140                                                               ; M109: Wait for hotend to reach 140°C
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                                                                 ; G28: Home all axes safely
    {% endif %}
    
    # 2. Park head in forward service position
    G90                                                                     ; G90: Set positioning to absolute mode
    G1 Z80 F3000                                                            ; G1: Lower bed platform to Z80 height
    G1 X110 Y20 F9000                                                       ; G1: Move nozzle front and center (X110, Y20)
    
    # 3. Heat toolhead to targeted nozzle replacement temperature once safely parked
    M117 Preheating for nozzle swap ({TARGET}°C)...
    M109 S{TARGET}                                                          ; M109: Wait for hotend to reach targeted replacement temperature
    M117 Nozzle at temperature. Swap carefully!


# ==============================================================================
# 7. SLICER COMPATIBILITY & OVERRIDES
# ==============================================================================

[gcode_macro T0]
description: Ignore T0 command from slicers (K1C uses 1 tool)
gcode:
    # 1. Null operation for single extruder setup
    # K1C is a single-extruder printer, ignore T0 tool selection commands sent by slicers

[gcode_macro M117]
rename_existing: M117.1
gcode:
    # 1. Relay status message to both LCD screen and web interface console
    {% if rawparams %}
        {% set msg = rawparams %}
        M117.1 {msg}                                                        ; Execute original Klipper status display command
        RESPOND MSG="{msg}"                                                 ; Output message string directly to Fluidd / Mainsail web console
    {% else %}
        M117.1
    {% endif %}

[gcode_macro CX_PRINT_LEVELING]
description: Overrides the 'Calibrate' checkbox on the Creality screen
gcode:
    # 1. Ignore stock Creality display leveling trigger
    # PRINT_START macro handles adaptive bed mesh independently
    M117 Screen leveling ignored (uses custom PRINT_START)

[gcode_macro CX_INPUT_SHAPING]
description: Ignores screen input shaping at start
gcode:
    # 1. Ignore stock Creality display input shaping trigger on start
    M117 Screen Input Shaping ignored

[gcode_macro G29]
rename_existing: G29.9
description: Intercepts G29 and allows it to perform custom actions or ignore
gcode:
    # 1. Intercept legacy G29 bed leveling call from old slicer profiles
    RESPOND MSG="G29 ignored by macro"
    
    # Option to call stock Creality routine if ever desired:
    # G29.9 {rawparams}                                                     ; Execute renamed legacy G29 leveling function


# ==============================================================================
# 8. SYSTEM, BACKUP & AUTOMATION
# ==============================================================================

[gcode_macro BACKUP_GITHUB]
description: Backs up Klipper configuration to GitHub
gcode:
    # 1. Execute shell command script to trigger git backup
    RUN_SHELL_COMMAND CMD=git_backup_script                                 ; Execute Linux shell script to commit and push configuration to GitHub

[gcode_shell_command git_backup_script]
command: sh /usr/data/printer_data/config/git_backup.sh                     ; Execute shell script in Klipper printer data directory
timeout: 30.0
verbose: True

[delayed_gcode backup_on_startup]
initial_duration: 10.0
gcode:
    # 1. Automatically trigger GitHub configuration backup 10 seconds after Klipper boots
    BACKUP_GITHUB                                                           ; Call BACKUP_GITHUB macro on startup
