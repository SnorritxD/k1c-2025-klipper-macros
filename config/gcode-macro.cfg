# ==============================================================================
#                     KLIPPER MACRO CONFIGURATIE INDEX
# ==============================================================================
# 1. PRINT CONTROLS ......... (PRINT_START, PRINT_END, CANCEL, PAUSE, RESUME)
# 2. FILAMENT BEHEER ........ (LOAD / UNLOAD PLA, PETG, ABS & M600)
# 3. PRINT VOORBEREIDING .... (CLEAN_NOZZLE, SMART_PURGE, CREATE_BED_MESH)
# 4. KALIBRATIE & SENSOREN .. (PID TUNING, INPUT SHAPER, ACCELEROMETER)
# 5. HARDWARE & OMGEVING .... (LED VERLICHTING, CHASSIS FAN / M141)
# 6. ONDERHOUD .............. (MAINTENANCE_PARK, CHANGE_NOZZLE)
# 7. SLICER COMPATIBILITEIT . (T0, M117 OVERRIDE)
# 8. SYSTEEM & AUTOMATISERING (GITHUB BACKUP & STARTUP SCRIPT)
# ==============================================================================


# ==============================================================================
# 1. PRINT CONTROLS (START / END / CANCEL / PAUSE / RESUME)
# ==============================================================================

[gcode_macro PRINT_START]
description: Volledige start-macro met aftellende Heat Soak, Clean, Native Adaptive Mesh en Smart Purge
gcode:
    # 1. Extract parameters passed from the slicer
    {% set BED_TEMP = params.BED_TEMP|default(params.BED|default(50))|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(params.EXTRUDER|default(200))|float %}
    {% set CHAMBER_TEMP = params.CHAMBER|default(0)|float %}
    {% set MATERIAL = params.MATERIAL|default('')|upper %}
    {% set SOAK_TIME = params.SOAK|default(-1)|int %}

    # Automatic Heat Soak duration determination (10 min for ABS/ASA/Bed >= 90°C, otherwise 0 min)
    {% if SOAK_TIME == -1 %}
        {% if MATERIAL in ['ABS', 'ASA', 'PC', 'PA', 'PA-CF'] or BED_TEMP >= 90 %}
            {% set SOAK_TIME = 10 %}
        {% else %}
            {% set SOAK_TIME = 0 %}
        {% endif %}
    {% endif %}

    # 2. Control chassis fan based on M141 chamber target or bed temperature
    {% set CHAMBER_TARGET = params.CHAMBER|default(35)|float %}
    {% if BED_TEMP >= 90 or MATERIAL in ['ABS', 'ASA', 'PC', 'PA', 'PA-CF'] %}
        SET_FAN_SPEED FAN=chassis_fan SPEED=0.0                               ; Turn off fan for high-temp materials (ABS/ASA) to prevent warping
    {% else %}
        SET_FAN_SPEED FAN=chassis_fan SPEED=0.8                               ; Turn on fan (80%) for low-temp materials (PLA/PETG)
    {% endif %}

    # 3. Heat nozzle to standby (140°C) before homing to soften hard filament blobs
    M117 Bed opwarmen ({BED_TEMP}°C), Nozzle naar standby (140°C)...
    M140 S{BED_TEMP}                                                           ; M140: Set bed temperature (non-blocking)
    M104 S140                                                                  ; M104: Set extruder temperature to standby (non-blocking)
    M109 S140                                                                  ; M109: Wait for extruder temperature to reach 140°C before homing
    M190 S{BED_TEMP}                                                           ; M190: Wait for bed temperature to reach target

    # 4. Safe homing sequence with warm nozzle
    {% if "xyz" not in printer.toolhead.homed_axes %}
        M117 Homen met warme nozzle...
        G28                                                                    ; G28: Home all axes (X, Y, Z)
    {% endif %}

    # 5. Countdown Heat Soak (active for ABS/ASA or Bed >= 90°C)
    {% if SOAK_TIME > 0 %}
        M117 Behuizing opwarmen ({SOAK_TIME} min heat soak)...
        {% for minute in range(SOAK_TIME, 0, -1) %}
            M117 Nog {minute} minuutjes kamer doorverwarmen...
            G4 P60000                                                          ; G4 P60000: Dwell/wait for 60,000 milliseconds (1 minute)
        {% endfor %}
    {% endif %}

    # 6. Thoroughly clean nozzle at the rear
    M117 Nozzle reinigen achterin...
    CLEAN_NOZZLE

    # 7. Native Klipper adaptive bed mesh calibration on a clean nozzle
    M117 Adaptieve bed mesh inmeten...
    BED_MESH_CALIBRATE ADAPTIVE=1

    # 8. Park front-left while heating to full printing temperature
    G90                                                                        ; G90: Absolute positioning mode
    G1 Z5 F3000                                                                ; G1: Move Z axis to 5mm at speed 3000 mm/min
    G1 X2 Y10 F9000                                                            ; G1: Move toolhead to X2 Y10 at speed 9000 mm/min

    # 9. Heat extruder to final printing temperature
    M117 Opstoken naar {EXTRUDER_TEMP}°C...
    M109 S{EXTRUDER_TEMP}                                                      ; M109: Wait for extruder to reach target printing temperature

    # 10. Execute smart adaptive purge line
    M117 Slimme purge line trekken...
    SMART_PURGE

    # 11. Start printing
    M117 Printen gestart!

# Alias for backwards compatibility with existing G-code files
[gcode_macro START_PRINT]
rename_existing: BASE_START_PRINT
gcode:
    PRINT_START {rawparams}

[gcode_macro PRINT_END]
description: Voltooit de print, zet heaters en fans uit en parkeert de printkop
gcode:
    # 1. Calculate safe Z-hop height to prevent toolhead from hitting bed frame limits
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% if act_z < (max_z - 10.0) %}
        {% set z_safe = 10.0 %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}

    # 2. Retract filament & lift toolhead
    G91                                                                        ; G91: Relative positioning mode
    G1 E-2 F2700                                                               ; G1: Retract 2mm of filament at feedrate 2700 mm/min
    G1 Z{z_safe} F3000                                                         ; G1: Raise Z axis by safe height
    G90                                                                        ; G90: Restore absolute positioning mode

    # 3. Park toolhead at the rear
    G1 X210 Y210 F9000                                                         ; G1: Move toolhead to back corner (X210, Y210)

    # 4. Turn off heaters
    M104 S0                                                                    ; M104: Turn off hotend heater
    M140 S0                                                                    ; M140: Turn off print bed heater

    # 5. Turn off all cooling fans
    M106 S0                                                                    ; M106 S0: Turn off part cooling fan
    SET_FAN_SPEED FAN=side_fan SPEED=0.0                                       ; Turn off auxiliary side cooling fan
    
    # Disable chassis exhaust fan via M141 macro
    M141 S0
    
    # Extra check if chassis_fan is defined as fan_generic
    {% if 'fan_generic chassis_fan' in printer %}
        SET_FAN_SPEED FAN=chassis_fan SPEED=0.0
    {% endif %}

    # 6. Disable stepper motors for X, Y, and Extruder (keep Z powered to support bed)
    M84 X Y E                                                                  ; M84: Disable steppers on specified axes

    # 7. Clear bed mesh from memory and notify user
    BED_MESH_CLEAR
    M117 Print succesvol afgerond!

# Alias for backwards compatibility
[gcode_macro END_PRINT]
rename_existing: BASE_END_PRINT
gcode:
    PRINT_END {rawparams}

[gcode_macro CANCEL_PRINT]
description: Breek de print af, zet alles uit en parkeer veilig
rename_existing: BASE_CANCEL_PRINT
gcode:
    # 1. SAFETY FIRST: Immediately turn off heaters
    M104 S0                                                                    ; M104: Turn off hotend heater
    M140 S0                                                                    ; M140: Turn off bed heater
    CLEAR_PAUSE

    # 2. SAFE MOVEMENT: Lift Z axis if toolhead is homed
    {% if "xyz" in printer.toolhead.homed_axes %}
        {% set max_z = printer.toolhead.axis_maximum.z|float %}
        {% set act_z = printer.toolhead.position.z|float %}
        {% if act_z < (max_z - 10.0) %}
            {% set z_safe = 10.0 %}
        {% else %}
            {% set z_safe = max_z - act_z %}
        {% endif %}
        
        G91                                                                    ; G91: Relative positioning mode
        G1 E-2 F2700                                                           ; G1: Retract 2mm of filament
        G1 Z{z_safe} F3000                                                     ; G1: Raise Z axis by safe offset
        G90                                                                    ; G90: Absolute positioning mode
        
        # Park toolhead safely at the rear
        G1 X210 Y210 F9000                                                     ; G1: Move toolhead to rear parking location
    {% endif %}

    # 3. TURN OFF FANS: Stop fans after toolhead reaches parking position
    M106 S0                                                                    ; M106: Turn off part cooling fan
    SET_FAN_SPEED FAN=side_fan SPEED=0.0
    M141 S0
    {% if 'fan_generic chassis_fan' in printer %}
        SET_FAN_SPEED FAN=chassis_fan SPEED=0.0
    {% endif %}

    # 4. MOTORS & MESH: Disable X/Y/E motors and clear active mesh
    M84 X Y E                                                                  ; M84: Disable X, Y, and Extruder motors
    BED_MESH_CLEAR
    M117 Print geannuleerd

    # 5. Call default Klipper cancel routine
    BASE_CANCEL_PRINT

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    {% set z = params.Z|default(10)|int %}
    SAVE_GCODE_STATE NAME=PAUSE_state                                          ; Save current toolhead state and coordinates
    BASE_PAUSE                                                                 ; Call Klipper native pause routine
    G91                                                                        ; G91: Relative positioning mode
    G1 E-2 F2700                                                               ; G1: Retract filament 2mm
    G1 Z{z} F3000                                                              ; G1: Raise Z axis by 10mm
    G90                                                                        ; G90: Absolute positioning mode
    G1 X10 Y220 F9000                                                          ; G1: Move toolhead to safe pause location

[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    G91                                                                        ; G91: Relative positioning mode
    G1 E2 F2700                                                                ; G1: Unretract/prime filament 2mm
    G90                                                                        ; G90: Absolute positioning mode
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1                                ; Restore toolhead location with motion (MOVE=1)
    BASE_RESUME                                                                ; Resume execution in Klipper


# ==============================================================================
# 2. FILAMENT BEHEER (LOAD / UNLOAD / M600)
# ==============================================================================

# ------------------------------------------------------------------------------
# FILAMENT LADEN
# ------------------------------------------------------------------------------

[gcode_macro LOAD_PLA]
description: Snelle en veilige PLA filament-invoer voor DXC + Unicorn Nozzle (geoptimaliseerd)
gcode:
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(220)|int %}
    
    M117 PLA opwarmen en laden...
    M109 S{EXTRUDER_TEMP}                                                      ; M109: Wait for hotend to reach target PLA temperature (220°C)
    
    G91                                                                        ; G91: Relative positioning mode
    
    # 1. Fast loading up to heatbreak/meltzone
    G1 E60 F800                                                                ; G1: Extrude 60mm of filament at speed 800 mm/min
    
    # 2. Transition into nozzle
    G1 E20 F300                                                                ; G1: Extrude 20mm at moderate speed 300 mm/min
    
    # 3. Purge line to clear old filament color
    G1 E15 F120                                                                ; G1: Slow extrude 15mm at speed 120 mm/min
    
    # 4. Anti-ooze retract
    G1 E-2 F1800                                                               ; G1: Retract 2mm quickly at speed 1800 mm/min
    
    G90                                                                        ; G90: Restore absolute positioning mode
    M400                                                                       ; M400: Wait for all planned moves to finish execution
    M104 S0                                                                    ; M104: Turn off hotend heater
    
    M117 PLA succesvol geladen!

[gcode_macro LOAD_PETG]
description: Snelle en veilige PETG filament-invoer voor DXC + Unicorn Nozzle (geoptimaliseerd)
gcode:
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(240)|int %}
    
    M117 PETG opwarmen en laden...
    M109 S{EXTRUDER_TEMP}                                                      ; M109: Wait for hotend to reach target PETG temperature (240°C)
    
    G91                                                                        ; G91: Relative positioning mode
    
    # 1. Fast loading up to meltzone
    G1 E60 F800                                                                ; G1: Extrude 60mm at speed 800 mm/min
    
    # 2. Transition into nozzle
    G1 E20 F300                                                                ; G1: Extrude 20mm at speed 300 mm/min
    
    # 3. Purge line for viscous PETG
    G1 E20 F120                                                                ; G1: Slow extrude 20mm at speed 120 mm/min
    
    # 4. Anti-ooze retract
    G1 E-2 F1800                                                               ; G1: Retract 2mm quickly at speed 1800 mm/min
    
    G90                                                                        ; G90: Restore absolute positioning mode
    M400                                                                       ; M400: Wait for move execution to complete
    M104 S0                                                                    ; M104: Turn off hotend heater
    
    M117 PETG succesvol geladen!

[gcode_macro LOAD_ABS]
description: Snelle en veilige ABS filament-invoer voor DXC + Unicorn Nozzle (geoptimaliseerd)
gcode:
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(255)|int %}
    
    M117 ABS opwarmen en laden...
    M109 S{EXTRUDER_TEMP}                                                      ; M109: Wait for hotend to reach target ABS temperature (255°C)
    
    G91                                                                        ; G91: Relative positioning mode
    
    # 1. Fast loading up to meltzone
    G1 E60 F800                                                                ; G1: Extrude 60mm at speed 800 mm/min
    
    # 2. Transition into nozzle
    G1 E20 F300                                                                ; G1: Extrude 20mm at speed 300 mm/min
    
    # 3. Extra purge for stiff/viscous ABS material
    G1 E25 F120                                                                ; G1: Slow extrude 25mm at speed 120 mm/min
    
    # 4. Anti-ooze retract
    G1 E-2 F1800                                                               ; G1: Retract 2mm quickly
    
    G90                                                                        ; G90: Restore absolute positioning mode
    M400                                                                       ; M400: Wait for move completion
    M104 S0                                                                    ; M104: Turn off hotend heater
    
    M117 ABS succesvol geladen!

# ------------------------------------------------------------------------------
# FILAMENT ONTLADEN & WISSELEN
# ------------------------------------------------------------------------------

[gcode_macro _DXC_RUNOUT_UNLOAD]
description: Trek het laatste restje filament uit de DXC voordat de printer parkeert
gcode:
    M118 Filament Runout! Restant uit DXC trekken...                           ; M118: Stuur melding naar de console
    
    {% if printer.extruder.can_extrude|lower == 'true' %}
        G91                                                                    ; G91: Relatieve positie-modus inschakelen
        
        # 1. Korte ramming/squish om de punt te vormen
        G1 E2 F300                                                             ; G1: Duw 2mm filament naar voren op snelheid 300 mm/min
        G1 E-10 F1500                                                          ; G1: Snelle retract van 10mm om de punt te vormen
        
        # 2. Langzame retract door de warmtezone (25mm)
        G1 E-25 F350                                                           ; G1: Trek 25mm langzaam terug (350 mm/min) door de smeltzone
        G4 P1500                                                               ; G4 P1500: Wacht/pauzeer 1,5 seconde om de punt te laten stollen
        
        # 3. Snelle retract voorbij de tandwielen (totaal 140mm)
        G1 E-105 F2000                                                         ; G1: Trek resterende 105mm snel terug (2000 mm/min) voorbij de tandwielen
        
        G90                                                                    ; G90: Terug naar absolute positie-modus
        M400                                                                   ; M400: Wacht tot alle bewegingen volledig zijn voltooid
    {% else %}
        M118 Nozzle temperatuur te laag om te retracteren!                     ; M118: Foutmelding als de nozzle te koud is
    {% endif %}
    PAUSE                                                                      ; PAUSE: Pauzeer de printer

[gcode_macro UNLOAD_PLA]
description: PLA Unload voorbij de tandwielen voor de DXC extruder
gcode:
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(220)|int %}
    
    M117 PLA opwarmen ({EXTRUDER_TEMP}°C)...                                   ; M117: Toon statusbericht op het scherm
    M109 S{EXTRUDER_TEMP}                                                      ; M109: Wacht tot de hotend op doeltemperatuur is
    
    {% if printer.extruder.can_extrude|lower == 'true' %}
        G91                                                                    ; G91: Relatieve positie-modus
        
        G1 E5 F120                                                             ; G1: Extrudeer 5mm langzaam om de nozzle schoon te persen
        G1 E2 F300                                                             ; G1: Lichte push voor puntvorming
        G1 E-10 F1500                                                          ; G1: Snelle retract van 10mm
        G1 E-25 F350                                                           ; G1: Langzame retract door de warmtezone (25mm)
        G4 P1500                                                               ; G4 P1500: Wacht 1,5 seconde voor stolling
        G1 E-105 F2000                                                         ; G1: Snelle retract voorbij tandwielen (105mm)
        
        G90                                                                    ; G90: Absolute positie-modus
        M400                                                                   ; M400: Wacht tot bewegingen klaar zijn
        M104 S0                                                                ; M104: Schakel hotend verwarming uit (temperatuur naar 0)
        
        M117 PLA los! Je kunt het er nu uitpakken.                             ; M117: Klaar melding
    {% else %}
        M117 Extruder te koud om te ontladen!                                  ; M117: Foutmelding
    {% endif %}

[gcode_macro UNLOAD_PETG]
description: PETG Unload voorbij de tandwielen voor de DXC extruder
gcode:
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(240)|int %}
    
    M117 PETG opwarmen ({EXTRUDER_TEMP}°C)...                                  ; M117: Toon statusbericht
    M109 S{EXTRUDER_TEMP}                                                      ; M109: Wacht op bereiken doeltemperatuur
    
    {% if printer.extruder.can_extrude|lower == 'true' %}
        G91                                                                    ; G91: Relatieve positie-modus
        
        G1 E5 F120                                                             ; G1: Extrudeer 5mm voor schone nozzle
        G1 E2 F300                                                             ; G1: Lichte push voor puntvorming
        G1 E-12 F1200                                                          ; G1: Retract van 12mm
        G1 E-28 F300                                                           ; G1: Langzame retract door de warmtezone (28mm)
        G4 P2000                                                               ; G4 P2000: Wacht 2,0 seconden (langer vanwege taaiheid van PETG)
        G1 E-100 F2000                                                         ; G1: Snelle retract voorbij tandwielen (100mm)
        
        G90                                                                    ; G90: Absolute positie-modus
        M400                                                                   ; M400: Wacht tot bewegingen klaar zijn
        M104 S0                                                                ; M104: Schakel hotend verwarming uit
        
        M117 PETG los! Je kunt het er nu uitpakken.                            ; M117: Klaar melding
    {% else %}
        M117 Extruder te koud om te ontladen!                                  ; M117: Foutmelding
    {% endif %}

[gcode_macro UNLOAD_ABS]
description: ABS Unload voorbij de tandwielen voor de DXC extruder (Geoptimaliseerd)
gcode:
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(255)|int %}
    
    M117 ABS opwarmen ({EXTRUDER_TEMP}°C)...                                   ; M117: Toon statusbericht
    M109 S{EXTRUDER_TEMP}                                                      ; M109: Wacht tot hotend op temperatuur is
    
    {% if printer.extruder.can_extrude|lower == 'true' %}
        G91                                                                    ; G91: Relatieve positie-modus
        
        G1 E5 F120                                                             ; G1: Kleine purge van 5mm voor schone start
        G1 E2 F400                                                             ; G1: Push om dikke punt te voorkomen
        G1 E-15 F1800                                                          ; G1: Snelle retract van 15mm
        G1 E-25 F300                                                           ; G1: Langzaam door de smeltzone (25mm)
        G4 P1500                                                               ; G4 P1500: Wacht 1,5 seconde voor afkoeling
        G1 E-100 F2200                                                         ; G1: Snel voorbij de tandwielen naar totaal 140mm (100mm)
        
        G90                                                                    ; G90: Absolute positie-modus
        M400                                                                   ; M400: Wacht tot bewegingen klaar zijn
        M104 S0                                                                ; M104: Schakel hotend verwarming uit
        
        M117 ABS los! Je kunt het er nu uitpakken.                             ; M117: Klaar melding
    {% else %}
        M117 Extruder te koud om te ontladen!                                  ; M117: Foutmelding
    {% endif %}

[gcode_macro M600]
description: Handmatige filament- of kleurwissel mid-print (geoptimaliseerd voor DXC + Unicorn)
gcode:
    {% set X = params.X|default(10)|float %}
    {% set Y = params.Y|default(20)|float %}
    {% set Z = params.Z|default(10)|float %}

    PAUSE X={X} Y={Y} Z={Z}                                                    ; PAUSE: Print pauzeren en kop parkeren
    M117 Filament ontladen voor kleurwissel...                                 ; M117: Statusbericht op scherm
    
    {% if printer.extruder.can_extrude|lower == 'true' %}
        G91                                                                    ; G91: Relatieve positie-modus
        
        G1 E2 F300                                                             ; G1: Lichte push voor puntvorming
        G1 E-10 F1500                                                          ; G1: Snelle retract van 10mm
        G1 E-25 F350                                                           ; G1: Langzame retract door de warmtezone (25mm)
        G4 P1500                                                               ; G4 P1500: Wacht 1,5 seconde voor stolling
        G1 E-105 F2000                                                         ; G1: Snelle retract voorbij de tandwielen (105mm)
        
        G90                                                                    ; G90: Absolute positie-modus
        M400                                                                   ; M400: Wacht tot bewegingen klaar zijn
        
        M117 Laad nieuw filament en druk op Resume!                            ; M117: Instructie om door te gaan
    {% else %}
        M117 Kan niet ontladen: Nozzle is te koud!                             ; M117: Foutmelding indien te koud
    {% endif %}

# ==============================================================================
# 3. PRINT VOORBEREIDING & GEOMETRIE
# ==============================================================================

[gcode_macro CLEAN_NOZZLE]
description: Veegt op 180°C, koelt af naar 140°C, veegt naloop weg en parkeert op X110 Y110 Z5
gcode:
    {% set HOME_TEMP = params.HOME_TEMP|default(140)|float %}
    {% set CLEAN_TEMP = params.CLEAN_TEMP|default(180)|float %}
    {% set MESH_TEMP = params.MESH_TEMP|default(140)|float %}
    
    # 1. Ensure toolhead is homed at safe temperature (140°C)
    {% if "xyz" not in printer.toolhead.homed_axes %}
        M104 S{HOME_TEMP}                                                      ; M104: Heat extruder to 140°C (non-blocking)
        M109 S{HOME_TEMP}                                                      ; M109: Wait for extruder to reach 140°C
        G28                                                                    ; G28: Home all axes
    {% endif %}
    
    G90                                                                        ; G90: Absolute positioning mode
    G1 Z5 F3000                                                                ; G1: Raise Z axis to 5mm at speed 3000 mm/min
    G1 X95 Y223 F9000                                                          ; G1: Move to cleaning brush starting point at rear (X95, Y223)
    
    # 2. First wiping cycle at 180°C (softens hardened debris/plastic)
    M109 S{CLEAN_TEMP}                                                         ; M109: Wait for hotend temperature to reach 180°C
    G1 Z1.8 F600                                                               ; G1: Lower nozzle into brush height (Z1.8mm)
    
    {% for wipe in range(1, 5) %}
        G1 X130 F12000                                                         ; G1: Wipe across brush rightward (X130) at speed 12000 mm/min
        G1 X95 F12000                                                          ; G1: Wipe across brush leftward (X95) at speed 12000 mm/min
    {% endfor %}
    
    # 3. Cool nozzle down to 140°C & perform secondary wipe (removes oozed residue)
    G1 Z5 F3000                                                                ; G1: Raise Z axis clear of brush during thermal transition
    M109 S{MESH_TEMP}                                                          ; M109: Wait for hotend temperature to drop to 140°C
    
    G1 Z1.8 F600                                                               ; G1: Lower back into brush wiping height
    {% for wipe in range(1, 3) %}
        G1 X130 F12000                                                         ; G1: Wipe rightward
        G1 X95 F12000                                                          ; G1: Wipe leftward
    {% endfor %}
    
    # 4. Park toolhead centered over bed at height Z5
    G1 Z5 F3000                                                                ; G1: Lift nozzle to height Z5
    G1 X110 Y110 F9000                                                         ; G1: Move toolhead to bed center (X110, Y110)

[gcode_macro SMART_PURGE]
description: Slimme adaptieve purge line vlak naast het model
gcode:
    # Determine model bounds (fallback to coordinates X10 Y10 if object data is unreadable)
    {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
    {% set x_min = all_points | map(attribute=0) | min | default(10) %}
    {% set y_min = all_points | map(attribute=1) | min | default(10) %}
    
    # Position adaptive purge line offset by 10mm Southwest of print bounds
    {% set purge_x = [x_min - 10, 5] | max %}
    {% set purge_y = [y_min - 10, 5] | max %}

    G90                                                                        ; G90: Absolute positioning mode
    G1 Z5 F3000                                                                ; G1: Lift Z to 5mm
    G1 X{purge_x} Y{purge_y} F9000                                             ; G1: Rapid move to computed purge start position
    G1 Z0.28 F600                                                              ; G1: Lower nozzle to first layer height (0.28mm)
    
    G92 E0                                                                     ; G92: Reset extruder position accumulator to 0
    G1 X{purge_x + 30} Y{purge_y} E10 F1500                                    ; G1: Extrude 10mm filament over 30mm line segment
    G1 X{purge_x + 30} Y{purge_y + 0.4} F5000                                  ; G1: Shift 0.4mm along Y axis
    G1 X{purge_x} Y{purge_y + 0.4} E20 F1500                                   ; G1: Extrude return purge line segment
    G92 E0                                                                     ; G92: Reset extruder coordinate to 0
    G1 Z2 F3000                                                                ; G1: Lift nozzle clear of purge line

[gcode_macro CREATE_BED_MESH]
description: Maakt bed mesh aan (gebruik SKIP_CLEAN=1 als de nozzle al schoon is)
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(50)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(140)|float %}
    {% set SKIP_CLEAN = params.SKIP_CLEAN|default(0)|int %}

    # 1. Heat components to allow thermal expansion stabilization
    M140 S{BED_TEMP}                                                           ; M140: Set bed temperature
    M104 S{EXTRUDER_TEMP}                                                      ; M104: Set hotend temperature
    
    M190 S{BED_TEMP}                                                           ; M190: Wait for bed target temperature
    M109 S{EXTRUDER_TEMP}                                                      ; M109: Wait for hotend target temperature

    # 2. Home axes if required
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                                                                    ; G28: Home X, Y, Z axes
    {% endif %}

    # 3. Clean nozzle unless explicitly skipped via parameter (SKIP_CLEAN=1)
    {% if SKIP_CLEAN == 0 %}
        CLEAN_NOZZLE
    {% endif %}

    # 4. Perform Klipper bed mesh calibration routine
    BED_MESH_CALIBRATE

    # 5. Park head over bed center at Z5
    G90                                                                        ; G90: Absolute positioning mode
    G1 Z5 F3000                                                                ; G1: Lift Z axis to 5mm
    G1 X110 Y110 F9000                                                         ; G1: Center toolhead on build surface

    # 6. Disable heaters
    M104 S0                                                                    ; M104: Turn off hotend heater
    M140 S0                                                                    ; M140: Turn off bed heater


# ==============================================================================
# 4. KALIBRATIE & SENSOREN
# ==============================================================================

# ------------------------------------------------------------------------------
# PID KALIBRATIE
# ------------------------------------------------------------------------------

[gcode_macro PID_HOTEND]
description: Voert een PID-kalibratie uit voor de hotend en slaat op
gcode:
    {% set TARGET = params.TARGET|default(230)|int %}
    M117 PID kalibratie hotend ({TARGET}°C)...
    PID_CALIBRATE HEATER=extruder TARGET={TARGET}                              ; Run native Klipper hotend PID autotune
    SAVE_CONFIG                                                                ; Save autotuned PID values to printer.cfg and restart Klipper
                                                                          
[gcode_macro PID_BED]
description: Voert een PID-kalibratie uit voor het printbed en slaat op
gcode:
    {% set TARGET = params.TARGET|default(60)|int %}
    M117 PID kalibratie bed ({TARGET}°C)...
    PID_CALIBRATE HEATER=heater_bed TARGET={TARGET}                            ; Run native Klipper bed PID autotune
    SAVE_CONFIG                                                                ; Save autotuned PID values to printer.cfg and restart Klipper

# ------------------------------------------------------------------------------
# INPUT SHAPER & ACCELEROMETER
# ------------------------------------------------------------------------------

[gcode_macro CALIBRATE_INPUT_SHAPER]
description: Voert een volledige Input Shaper kalibratie uit voor X en Y en slaat op
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                                                                    ; G28: Home all axes prior to testing
    {% endif %}
    M117 Input Shaper kalibratie starten...
    SHAPER_CALIBRATE                                                           ; Run frequency sweep test on X and Y axes using accelerometer
    M117 Resultaten opslaan...
    SAVE_CONFIG                                                                ; Save frequency limits and chosen shaper modes to configuration

[gcode_macro CALIBRATE_SHAPER_X]
description: Voert een Input Shaper kalibratie uit voor alleen de X-as
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                                                                    ; G28: Home all axes prior to testing
    {% endif %}
    M117 Input Shaper X-as starten...
    SHAPER_CALIBRATE AXIS=X                                                    ; Run resonance frequency sweep specifically on X axis
    SAVE_CONFIG                                                                ; Save results to configuration file

[gcode_macro CALIBRATE_SHAPER_Y]
description: Voert een Input Shaper kalibratie uit voor alleen de Y-as
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                                                                    ; G28: Home all axes prior to testing
    {% endif %}
    M117 Input Shaper Y-as starten...
    SHAPER_CALIBRATE AXIS=Y                                                    ; Run resonance frequency sweep specifically on Y axis
    SAVE_CONFIG                                                                ; Save results to configuration file

[gcode_macro TEST_ACCEL]
description: Controleert of de versnellingsmeters van de K1C reageren
gcode:
    ACCELEROMETER_QUERY                                                        ; Query internal ADXL/LIS3DH sensors to confirm communication


# ==============================================================================
# 5. HARDWARE CONTROLS (FANS & LIGHTS)
# ==============================================================================

# Fluidd interface LED toggle logic & screen button compatibility
[gcode_macro TOGGLE_LED]
description: Schakelt de LED-verlichting aan/uit
gcode:
    {% if printer["led lighting"].color_data[0][3] > 0 %}
        SET_LED LED=lighting WHITE=0.0                                         ; Turn LED strip completely off
    {% else %}
        SET_LED LED=lighting WHITE=1.0                                         ; Turn LED strip to full brightness
    {% endif %}

# RESTORED: Temperature Fan target adjustment macro
[gcode_macro SET_CHASSIS_TARGET]
description: Stel de streeftemperatuur van de behuizing in (bijv. SET_CHASSIS_TARGET TARGET=40)
gcode:
    {% set TARGET = params.TARGET|default(35)|float %}
    SET_TEMPERATURE_FAN_TARGET temperature_fan=chassis_fan target={TARGET}     ; Adjust PID target for chassis fan
    M117 Chassis doel: {TARGET}°C

[gcode_macro M141]
description: Koppel OrcaSlicer kamertemperatuur (M141) aan de fan_generic
gcode:
    {% set S = params.S|default(0)|float %}
    {% if S > 0 and S <= 40 %}
        SET_FAN_SPEED FAN=chassis_fan SPEED=0.8                                ; PLA/PETG: Cool chamber at 80% speed for low target temp (<=40°C)
    {% else %}
        SET_FAN_SPEED FAN=chassis_fan SPEED=0.0                                ; ABS/ASA: Keep exhaust fan OFF for chamber targets >40°C
    {% endif %}


# ==============================================================================
# 6. ONDERHOUD & NOZZLE WISSEL
# ==============================================================================

[gcode_macro MAINTENANCE_PARK]
description: Zet de printkop koud vooraan voor onderhoud of bouwplaat wisselen
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                                                                    ; G28: Home all axes prior to positioning
    {% endif %}
    G90                                                                        ; G90: Absolute positioning mode
    G1 Z80 F3000                                                               ; G1: Lower bed to Z80 (raising head clearing distance) at speed 3000 mm/min
    G1 X110 Y20 F9000                                                          ; G1: Position toolhead front-center (X110, Y20)
    M117 Onderhoudsstand actief (koud)

[gcode_macro CHANGE_NOZZLE]
description: Warmt op naar 140C, homet veilig, parkeert vooraan en warmt door voor wissel
gcode:
    {% set TARGET = params.TEMP|default(220)|int %}
    
    # 1. Warm toolhead safely to softening point before homing to protect PEI bed sheet
    M104 S140                                                                  ; M104: Heat hotend to 140°C (non-blocking)
    M109 S140                                                                  ; M109: Wait for hotend temperature reaching 140°C
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                                                                    ; G28: Home all axes safely
    {% endif %}
    
    # 2. Park head in forward service position
    G90                                                                        ; G90: Absolute positioning mode
    G1 Z80 F3000                                                               ; G1: Lower bed platform to Z80 height
    G1 X110 Y20 F9000                                                          ; G1: Move nozzle front and center (X110, Y20)
    
    # 3. Heat toolhead to targeted nozzle replacement temperature once safely parked
    M117 Voorverwarmen voor nozzlewissel ({TARGET}°C)...
    M109 S{TARGET}                                                             ; M109: Wait for hotend temperature reaching target wissel temp
    M117 Nozzle op temperatuur. Wissel voorzichtig!


# ==============================================================================
# 7. SLICER COMPATIBILITEIT & OVERRIDES
# ==============================================================================

[gcode_macro T0]
description: Negeer T0 commando uit slicers (K1C gebruikt 1 tool)
gcode:
    # Null operation macro (K1C is a single-extruder system, ignores T0 tool selection commands)

[gcode_macro M117]
rename_existing: M117.1
gcode:
    {% if rawparams %}
        {% set msg = rawparams %}
        M117.1 {msg}                                                           ; Call original Klipper M117 status display command
        RESPOND MSG="{msg}"                                                    ; Output message string directly to Fluidd / Mainsail web console
    {% else %}
        M117.1
    {% endif %}

[gcode_macro CX_PRINT_LEVELING]
description: Overrides het 'Calibrate' vinkje van het Creality scherm
gcode:
    # Ignore stock screen leveling checkbox (PRINT_START macro manages adaptive bed mesh independently)
    M117 Scherm-kalibratie genegeerd (gebruikt eigen PRINT_START)

[gcode_macro CX_INPUT_SHAPING]
description: Negeert scherm input shaping bij start
gcode:
    # Ignore stock screen input shaping checkbox on print start
    M117 Scherm Input Shaping genegeerd

[gcode_macro G29]
rename_existing: G29.9
description: Vangt G29 af en laat het desgewenst iets anders doen of negeren
gcode:
    # Intercept standard G29 bed leveling call from legacy slicer profiles
    RESPOND MSG="G29 genegeerd door macro"
    
    # Option to call stock Creality routine if ever desired:
    # G29.9 {rawparams}                                                        ; Executes renamed legacy G29 leveling function


# ==============================================================================
# 8. SYSTEEM, BACKUP & AUTOMATISERING
# ==============================================================================

[gcode_macro BACKUP_GITHUB]
description: Maakt een backup van de klipper configuratie naar GitHub
gcode:
    RUN_SHELL_COMMAND CMD=git_backup_script                                    ; Execute Linux shell command script to commit and push printer configuration

[gcode_shell_command git_backup_script]
command: sh /usr/data/printer_data/config/git_backup.sh                        ; Run shell script located in Klipper printer data directory
timeout: 30.0
verbose: True

[delayed_gcode backup_on_startup]
initial_duration: 10.0
gcode:
    BACKUP_GITHUB                                                              ; Trigger automatic GitHub configuration backup 10 seconds after Klipper startup
