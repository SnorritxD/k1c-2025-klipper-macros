# ==============================================================================
# CREALITY K1C (2025 MODEL / X2600) HARDWARE CONFIGURATION
# ==============================================================================

# Chassis LED - K1C 2025 (X2600 Main MCU, GPIO PA8)
[led lighting]
white_pin: PA8
initial_WHITE: 1.0

# 1. Model Cooling Fan (Part Cooling Fan on Toolhead)
[fan_generic model_fan]
pin: !nozzle_mcu:PB10
enable_pin: nozzle_mcu:PC15
tachometer_pin: nozzle_mcu:PA15
off_below: 0.15
max_power: 1.0

# 2. Side Auxiliary Fan (Chassis Side Wall)
[fan_generic side_fan]
pin: PA6
kick_start_time: 0.500
off_below: 0.20
max_power: 1.0

# 3. Chassis Exhaust Fan
[fan_generic chassis_fan]
pin: PA10
kick_start_time: 0.100
off_below: 0.15
max_power: 1.0

# DXC Filament Sensor (Cold Swap setup)
[filament_switch_sensor DXC]
pause_on_runout: false
switch_pin: nozzle_mcu:PB9
event_delay: 1.5
pause_delay: 0.25
insert_gcode: 
    M118 Filament geladen in DXC.
runout_gcode:
    _DXC_RUNOUT_UNLOAD
